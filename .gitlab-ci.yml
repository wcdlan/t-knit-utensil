default:
  image: node:22-alpine

stages:
  - build
  - package

variables:
  PNPM_VERSION: '10.26.1'
  TARBALL_NAME: tku-${CI_COMMIT_TAG}.tar.gz

# ============================================================
# 仅在推送 tag 时运行
# ============================================================
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

# ============================================================
# 编译 & 打包阶段
# ============================================================
build:
  stage: build
  before_script:
    - corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm build
    - cd dist && tar czf ../${TARBALL_NAME} .
  artifacts:
    name: ${TARBALL_NAME%.tar.gz}
    paths:
      - ${TARBALL_NAME}
    expire_in: 30 days

# ============================================================
# Docker 镜像构建 & 推送到私有仓库
# ============================================================
docker:
  stage: package
  image: docker:stable
  services:
    - docker:dind
  variables:
    REGISTRY: v4.nagioa.cn:35481
    IMAGE_NAME: entropycrop/t-knit-utensil
  before_script:
    - docker login -u ${REGISTRY_USER} -p ${REGISTRY_PASSWORD} ${REGISTRY}
  script:
    - |
      MAJOR=$(echo ${CI_COMMIT_TAG#v} | cut -d. -f1)
      MINOR=$(echo ${CI_COMMIT_TAG#v} | cut -d. -f2)
      PATCH=$(echo ${CI_COMMIT_TAG#v} | cut -d. -f3)

      IMAGE=${REGISTRY}/${IMAGE_NAME}

      docker build -t ${IMAGE}:latest \
                   -t ${IMAGE}:${CI_COMMIT_TAG} \
                   -t ${IMAGE}:${MAJOR} \
                   -t ${IMAGE}:${MAJOR}.${MINOR} \
                   -t ${IMAGE}:${MAJOR}.${MINOR}.${PATCH} .

      docker push ${IMAGE}:latest
      docker push ${IMAGE}:${CI_COMMIT_TAG}
      docker push ${IMAGE}:${MAJOR}
      docker push ${IMAGE}:${MAJOR}.${MINOR}
      docker push ${IMAGE}:${MAJOR}.${MINOR}.${PATCH}