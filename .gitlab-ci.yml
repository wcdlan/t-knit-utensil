default:
  image: node:22-alpine

stages:
  - build
  - package

variables:
  PNPM_VERSION: '10.26.1'
  TARBALL_NAME: tku-${CI_COMMIT_TAG}.tar.gz
  NEXUS: v4.nagioa.cn:35483   # 你的 Nexus 仓库地址
  IMAGE_NAME: entropycrop/t-knit-utensil

# 仅在推送 tag 时运行
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

build:
  stage: build
  before_script:
    - corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm build
    - cd dist && tar czf ../${TARBALL_NAME} .
  artifacts:
    name: ${TARBALL_NAME%.tar.gz}
    paths:
      - ${TARBALL_NAME}
    expire_in: 30 days

docker:
  stage: package
  image: docker:stable
  services:
    - name: docker:dind
      command: [ "--insecure-registry=NEXUS" ]   # 若 Nexus 使用 HTTP 则必须添加
  before_script:
    # 使用 --password-stdin 安全登录
    - echo "$NEXUS_PASSWORD" | docker login "$NEXUS" -u "$NEXUS_USER" --password-stdin
  script:
    - |
      MAJOR=$(echo ${CI_COMMIT_TAG#v} | cut -d. -f1)
      MINOR=$(echo ${CI_COMMIT_TAG#v} | cut -d. -f2)
      PATCH=$(echo ${CI_COMMIT_TAG#v} | cut -d. -f3)

      IMAGE=${NEXUS}/${IMAGE_NAME}

      docker build -t ${IMAGE}:latest \
                   -t ${IMAGE}:${CI_COMMIT_TAG} \
                   -t ${IMAGE}:${MAJOR} \
                   -t ${IMAGE}:${MAJOR}.${MINOR} \
                   -t ${IMAGE}:${MAJOR}.${MINOR}.${PATCH} .

      # 逐个推送（可合并为 docker push --all-tags，但稳妥起见逐个推）
      docker push ${IMAGE}:latest
      docker push ${IMAGE}:${CI_COMMIT_TAG}
      docker push ${IMAGE}:${MAJOR}
      docker push ${IMAGE}:${MAJOR}.${MINOR}
      docker push ${IMAGE}:${MAJOR}.${MINOR}.${PATCH}