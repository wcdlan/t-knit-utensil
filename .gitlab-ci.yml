# ============================================================
# GitLab CI/CD — t-knit-utensil
# ============================================================
default:
  image: node:24-alpine

stages:
  - build
  - build-docker
  - deploy

variables:
  NEXUS: v4.nagioa.cn:35483
  IMAGE_NAME: entropycrop/t-knit-utensil
  IMAGE_NAME_WEB: entropycrop/t-knit-utensil-web
  NODEJS_ORG_MIRROR: "https://registry.npmmirror.com/-/binary/node"
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  SSH_PRIVATE_KEY: -----BEGIN OPENSSH PRIVATE KEY-----
  DEPLOY_USER: root
  DEPLOY_HOST: 127.0.0.1
  DEPLOY_PORT: 22
  DEPLOY_PATH: /home/tku

workflow:
  rules:
    - if: $CI_COMMIT_TAG != null
      when: always
    - when: never

# ============================================================
# Job 1: 构建 & 打包
# ============================================================
build:
  tags:
    - linux
    - docker
  stage: build

  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - node_modules

  before_script:
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.tuna.tsinghua.edu.cn/g' /etc/apk/repositories
    - apk update
    - apk add --no-cache python3 make g++
    - corepack enable && corepack prepare pnpm@10.26.1 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm config set registry $NPM_CONFIG_REGISTRY

  script:
    - pnpm install --frozen-lockfile
    # 将 Git Tag（如 v1.2.3）注入构建，前端显示版本号（保留 v 前缀）
    - export VITE_APP_VERSION="${CI_COMMIT_TAG}"
    - pnpm build

  artifacts:
    paths:
      - dist
    expire_in: 1 week

# ============================================================
# Job 2: Docker 镜像构建 & 推送
# ============================================================
docker:
  tags:
    - linux
    - docker
  stage: build-docker
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - build

  variables:
    DOCKER_BUILDKIT: '1'
    DOCKER_TLS_CERTDIR: '/certs'

  before_script:
    # 安全登录 Nexus（密码走 stdin，不出现在进程列表）
    - echo "$NEXUS_PASSWORD" | docker login "$NEXUS" -u "$NEXUS_USER" --password-stdin

  script:
    - |
      VERSION=${CI_COMMIT_TAG#v}
      MAJOR=${VERSION%%.*}
      REST=${VERSION#*.}
      MINOR=${REST%%.*}
      PATCH=${REST#*.}

      API_IMAGE=${NEXUS}/${IMAGE_NAME}
      WEB_IMAGE=${NEXUS}/${IMAGE_NAME_WEB}

      echo ">>> 构建 API 镜像: ${API_IMAGE}"
      docker build \
        -f docker/Dockerfile \
        --build-arg VITE_APP_VERSION=${CI_COMMIT_TAG} \
        -t ${API_IMAGE}:latest \
        -t ${API_IMAGE}:${CI_COMMIT_TAG} \
        -t ${API_IMAGE}:${MAJOR} \
        -t ${API_IMAGE}:${MAJOR}.${MINOR} \
        -t ${API_IMAGE}:${MAJOR}.${MINOR}.${PATCH} \
        .

      echo ">>> 构建前端 nginx 镜像: ${WEB_IMAGE}"
      docker build \
        -f docker/Dockerfile.nginx \
        --build-arg VITE_APP_VERSION=${CI_COMMIT_TAG} \
        -t ${WEB_IMAGE}:latest \
        -t ${WEB_IMAGE}:${CI_COMMIT_TAG} \
        -t ${WEB_IMAGE}:${MAJOR} \
        -t ${WEB_IMAGE}:${MAJOR}.${MINOR} \
        -t ${WEB_IMAGE}:${MAJOR}.${MINOR}.${PATCH} \
        .

      echo ">>> 推送镜像至 ${NEXUS} ..."
      for img in ${API_IMAGE} ${WEB_IMAGE}; do
        for tag in latest ${CI_COMMIT_TAG} ${MAJOR} ${MAJOR}.${MINOR} ${MAJOR}.${MINOR}.${PATCH}; do
          echo "    推送: ${img}:${tag}"
          docker push ${img}:${tag}
        done
      done

      echo ">>> 完成"
# ============================================================
# Job 3: 部署到远程服务器
# ============================================================
deploy:
  tags:
    - linux
    - docker
  stage: deploy
  image: alpine:latest
  needs:
    - docker
  before_script:
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.tuna.tsinghua.edu.cn/g' /etc/apk/repositories
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh  -p "$DEPLOY_PORT" "$DEPLOY_USER"@"$DEPLOY_HOST" << EOF
        set -e
        cd "$DEPLOY_PATH"
      
        # 直接拉取公开镜像（无需登录）
        docker pull ${NEXUS}/${IMAGE_NAME}:latest
        docker pull ${NEXUS}/${IMAGE_NAME_WEB}:latest
      
        # 重启服务
        docker compose down
        docker compose up -d
      
        # 清理旧镜像
        docker image prune -f
      EOF
  only:
    - tags