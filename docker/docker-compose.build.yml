# TKU — docker-compose 本地构建（build 方案）
#
# 与 docker-compose.yml（拉取镜像）的区别：本文件在本地构建镜像后启动。
# 用法（docker 目录下）：
#   docker compose -f docker-compose.build.yml up -d --build
# 访问：http://localhost:8080
#
# 构建产物镜像名：tku-api:local / tku-web:local（不入私有仓库）
# 配置持久化：api 容器挂载 ./data 卷，DB_PATH=/app/data/site.db 指向该卷

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tku-api:local
    environment:
      - PORT=8080
      - DB_PATH=/app/data/site.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    image: tku-web:local
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped